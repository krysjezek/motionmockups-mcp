name: Release

# Publishes motionmockups to npm, with provenance, and attaches the Claude Desktop extension
# to a GitHub release. Only a pushed tag vX.Y.Z of a commit on main, on the canonical
# repository, runs it: no pull request, fork or manual run can. npm trusted publishing (OIDC)
# authorises the publish; there is no npm token anywhere. See RELEASING.md.
#
# Four jobs, each with only what it needs:
# - build runs the project and its dependencies (build, smoke, pack, then the tests and the
#   extension check) and holds no OIDC token and no write access;
# - attest signs a build provenance attestation for the .mcpb and runs no project code;
# - publish holds the OIDC token and runs no project code: it publishes the tested tarball;
# - release can write to the repository, only to attach the .mcpb to a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'krysjezek/motionmockups-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main: release only commits on main."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: The tag is v + package.json's version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)."
            exit 1
          fi
      # Every dependency, @anthropic-ai/mcpb included, exactly as package-lock.json pins it,
      # with no install script run.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/smoke.mjs
      - run: node scripts/mcpb.mjs
      # The tarball and the extension are packed and uploaded from this commit's own build
      # before any third-party tool runs: the tests and the extension check below come after.
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            motionmockups-*.tgz
            motionmockups.mcpb
          if-no-files-found: error
      # A failure here fails the job, so publish (which needs it) never runs.
      # Linux runners have no display: xvfb-run gives window-mode Chrome one (as in ci.yml).
      - run: xvfb-run -a npm test
      - name: Check the desktop extension with the format's own tools
        run: |
          node_modules/.bin/mcpb unpack motionmockups.mcpb "$RUNNER_TEMP/mcpb"
          node_modules/.bin/mcpb validate "$RUNNER_TEMP/mcpb/manifest.json"

  # A build provenance attestation for the .mcpb, in GitHub's attestation store, so anyone can
  # check that a downloaded extension came from this workflow at the tag's commit
  # (gh attestation verify motionmockups.mcpb --repo krysjezek/motionmockups-mcp). No checkout
  # and no project code; the npm tarball's provenance comes from npm publish itself.
  attest:
    if: github.repository == 'krysjezek/motionmockups-mcp'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: motionmockups.mcpb

  publish:
    if: github.repository == 'krysjezek/motionmockups-mcp'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The OIDC token npm trusted publishing exchanges; no write access to the repository, no
    # checkout and no project code.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm can publish with trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is older than 11.5.1, which trusted publishing needs."; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: The tarball is motionmockups at the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          tgz="motionmockups-$version.tgz"
          test -f "$tgz" || { echo "::error::$tgz is missing."; exit 1; }
          tar -xzOf "$tgz" package/package.json > "$RUNNER_TEMP/package.json"
          node -e "const p=require(process.argv[1]); process.exit(p.name==='motionmockups'&&p.version===process.argv[2]?0:1)" "$RUNNER_TEMP/package.json" "$version" \
            || { echo "::error::$tgz is not motionmockups $version."; exit 1; }
      - name: Publish (a prerelease under next, never latest)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          tag=""
          case "$VERSION" in *-*) tag="--tag next" ;; esac
          npm publish "motionmockups-$VERSION.tgz" --provenance --access public --ignore-scripts $tag

  release:
    if: github.repository == 'krysjezek/motionmockups-mcp'
    needs: [publish, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only to create the GitHub release and attach the .mcpb; no OIDC token here.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Create the GitHub release with the desktop extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" motionmockups.mcpb \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" $prerelease \
            --notes "npm: https://www.npmjs.com/package/motionmockups/v/${GITHUB_REF_NAME#v}. motionmockups.mcpb is the Claude Desktop extension: open it with Claude Desktop to install."
